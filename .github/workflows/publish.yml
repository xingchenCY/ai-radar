name: publish-ai-radar

on:
  schedule:
    # Avoid GitHub's top-of-hour load while keeping a 30-minute cadence.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "仅首次部署时允许使用 bootstrap 快照"
        required: false
        default: false
        type: boolean

concurrency:
  group: ai-radar-publish
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHON_VERSION: '3.12'
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve Pages URL
        id: pages-url
        shell: bash
        run: |
          if [ -n "$PAGES_BASE_URL" ]; then
            echo "url=${PAGES_BASE_URL%/}" >> "$GITHUB_OUTPUT"
            echo "base=${PAGES_BASE_PATH:-}" >> "$GITHUB_OUTPUT"
          else
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY##*/}"
            if [ "$name" = "${owner}.github.io" ]; then
              echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
              echo "base=" >> "$GITHUB_OUTPUT"
            else
              echo "url=https://${owner}.github.io/${name}" >> "$GITHUB_OUTPUT"
              echo "base=/${name}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Read deployed snapshot
        id: previous
        shell: bash
        run: |
          mkdir -p data
          snapshot_url="${{ steps.pages-url.outputs.url }}/data/snapshot.json?run=${GITHUB_RUN_ID}"
          if curl --fail --location --silent --show-error --max-time 30 "$snapshot_url" -o data/previous.json; then
            python -m json.tool data/previous.json >/dev/null
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bootstrap }}" = "true" ]; then
            cp bootstrap/snapshot.json data/previous.json
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "using bootstrap snapshot for explicitly requested first deployment"
          else
            echo "Unable to read deployed snapshot; refusing to publish a replacement." >&2
            exit 1
          fi
      - name: Collect, merge and validate
        run: python -m collector.update --output web/public/data/snapshot.json --previous data/previous.json
      - name: Refuse an empty first deployment
        if: steps.previous.outputs.available == 'false'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('web/public/data/snapshot.json').read_text())
          if data['overall_status'] == 'failed':
              raise SystemExit('all sources failed during first deployment; refusing to publish bootstrap-only data')
          PY
      - name: Run collector tests
        run: python -m pytest -q
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('web/public/data/snapshot.json')
          data = json.loads(path.read_text())
          assert data['schema_version'] == 1
          assert len(data['articles']) <= 1200
          assert len({article['article_id'] for article in data['articles']}) == len(data['articles'])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"snapshot articles={len(data['articles'])} sha256={digest}")
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Astro site
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages-url.outputs.base }}
          SITE_URL: ${{ steps.pages-url.outputs.url }}
        run: npm ci && npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
